<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Startpagina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Start Page design system */
  :root {
    --surface: #FBF7EE;
    --panel: #FFFFFF;
    --ink: #2A2233;
    --muted: #6F6679;
    --line: #E8E0D0;
    --plum: #3B2B4A;
    --gold: #F4B840;
    --cream: #FAF3E0;
    --gold-ink: #8A5A00;
    --plum-tint: #EDE6F2;
    --space-2: 8px;
    --space-4: 16px;
    --space-6: 24px;
    --space-10: 40px;
    --radius-sm: 8px;
    --radius-md: 16px;
  }
  :root[data-theme="dark"] {
    --surface: #1E1726;
    --panel: #2A2036;
    --ink: #F5EEDD;
    --muted: #B3A8BF;
    --line: #3A2F47;
    --gold-ink: #F4B840;
    --plum-tint: #33273F;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--surface);
    color: var(--ink);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: var(--space-6) var(--space-4) 60px;
    transition: background 0.15s, color 0.15s;
  }

  .wrap { max-width: 720px; margin: 0 auto; }

  /* Header */
  header { margin-bottom: var(--space-10); }
  .header-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: var(--space-4);
  }
  .clock {
    font-size: 40px;
    line-height: 44px;
    font-weight: 300;
    margin: 0 0 var(--space-2);
    font-variant-numeric: tabular-nums;
  }
  .date-line {
    font-size: 28px;
    line-height: 34px;
    font-weight: 600;
    margin: 0 0 6px;
  }
  .weather-line {
    color: var(--muted);
    font-size: 13px;
    line-height: 18px;
    margin: 0;
  }
  .theme-toggle {
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    border-radius: 999px;
    border: none;
    background: var(--panel);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .theme-toggle svg { width: 16px; height: 16px; }
  .theme-toggle .moon { display: block; }
  .theme-toggle .sun { display: none; }
  [data-theme="dark"] .theme-toggle .moon { display: none; }
  [data-theme="dark"] .theme-toggle .sun { display: block; }

  /* Sections */
  section { margin-bottom: var(--space-10); }
  .section-head {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    margin-bottom: var(--space-4);
  }
  .text-btn {
    border: none;
    background: none;
    color: var(--gold-ink);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 4px 2px;
    cursor: pointer;
  }
  .text-btn:hover { color: var(--ink); }
  :focus-visible { outline: 2px solid var(--plum); outline-offset: 2px; }
  [data-theme="dark"] :focus-visible { outline-color: var(--gold); }

  /* Shortcuts */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
    gap: var(--space-4);
  }
  .tile {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--space-2);
    text-decoration: none;
    color: var(--ink);
    padding: var(--space-4) 6px 10px;
    background: var(--panel);
    border-radius: var(--radius-md);
  }
  .tile img { width: 26px; height: 26px; border-radius: 6px; }
  .tile span {
    font-size: 12px;
    line-height: 16px;
    font-weight: 600;
    text-align: center;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .tile.add-tile {
    justify-content: center;
    color: var(--muted);
    background: var(--plum-tint);
    cursor: pointer;
    min-height: 76px;
  }
  .tile.add-tile span { font-size: 22px; font-weight: 400; }

  .remove-x {
    position: absolute;
    top: -6px;
    right: -6px;
    width: 20px;
    height: 20px;
    border-radius: 999px;
    background: var(--plum);
    color: var(--cream);
    border: 2px solid var(--surface);
    font-size: 12px;
    line-height: 1;
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  body.editing .remove-x { display: flex; }
  body.editing .tile { animation: wiggle 0.25s infinite alternate; }
  @keyframes wiggle {
    from { transform: rotate(-0.6deg); }
    to { transform: rotate(0.6deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    body.editing .tile { animation: none; }
  }

  /* Forms */
  .add-form {
    display: none;
    flex-direction: column;
    gap: var(--space-2);
    background: var(--panel);
    border-radius: var(--radius-md);
    padding: var(--space-4);
    margin-top: var(--space-4);
  }
  .add-form.open { display: flex; }
  .add-form input {
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    font-family: inherit;
    font-size: 16px;
    background: var(--surface);
    color: var(--ink);
  }
  .add-form .row { display: flex; gap: var(--space-2); }
  .add-form .row button { flex: 1; }

  button.primary {
    background: var(--plum);
    color: var(--cream);
    border: none;
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    font-family: inherit;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  button.ghost {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
  }

  /* News */
  .news-list { display: flex; flex-direction: column; }
  .news-item {
    display: block;
    text-decoration: none;
    color: var(--ink);
    padding: 14px 0;
    border-bottom: 1px solid var(--line);
  }
  .news-item:last-child { border-bottom: none; }
  .news-item .headline {
    font-size: 15px;
    line-height: 22px;
    font-weight: 400;
    margin-bottom: 4px;
  }
  .news-meta {
    font-size: 13px;
    line-height: 18px;
    color: var(--muted);
    display: flex;
    gap: var(--space-2);
    align-items: center;
  }
  .source-tag {
    font-size: 12px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--plum-tint);
    color: var(--ink);
  }
  .news-state { color: var(--muted); font-size: 13px; padding: 20px 0; }

  /* Feed manager */
  .feed-manager {
    display: none;
    flex-direction: column;
    gap: 10px;
    background: var(--panel);
    border-radius: var(--radius-md);
    padding: var(--space-4);
    margin-bottom: var(--space-4);
  }
  .feed-manager.open { display: flex; }
  .feed-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-size: 14px;
  }
  .feed-row .feed-name { flex: 1; }
  .feed-row .remove-feed {
    border: none;
    background: none;
    color: var(--muted);
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  label.switch {
    position: relative;
    display: inline-block;
    width: 38px;
    height: 22px;
    flex-shrink: 0;
  }
  label.switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute;
    cursor: pointer;
    inset: 0;
    background: var(--line);
    border-radius: 999px;
    transition: 0.15s;
  }
  .slider::before {
    content: "";
    position: absolute;
    width: 16px;
    height: 16px;
    left: 3px;
    top: 3px;
    background: #FFFFFF;
    border-radius: 999px;
    transition: 0.15s;
  }
  input:checked + .slider { background: var(--plum); }
  [data-theme="dark"] input:checked + .slider { background: var(--gold); }
  input:checked + .slider::before { transform: translateX(16px); }

  /* iPad and desktop */
  @media (min-width: 860px) {
    body { padding: var(--space-10) 32px 60px; }
    .wrap { max-width: 1080px; }
    .columns {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 48px;
      align-items: start;
    }
    #newsSection { padding-left: var(--space-6); }
  }
</style>
<script>
try {
  document.documentElement.setAttribute("data-theme",
    localStorage.getItem("startpage_theme") ||
    (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
} catch (e) {}
</script>
</head>
<body>
<div class="wrap">

  <header>
    <div class="header-row">
      <div>
        <p class="clock" id="clock"></p>
        <p class="date-line" id="dateLine"></p>
        <p class="weather-line" id="weatherLine">Weer laden...</p>
      </div>
      <button class="theme-toggle" id="themeToggle" aria-label="Wissel thema">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <div class="columns">
  <section id="shortcutsSection">
    <div class="section-head">
      <button class="text-btn" id="editToggle">Bewerken</button>
    </div>
    <div class="grid" id="tileGrid"></div>
    <div class="add-form" id="addForm">
      <input type="text" id="newName" placeholder="Naam, bijvoorbeeld Notion">
      <input type="text" id="newUrl" placeholder="Website, bijvoorbeeld notion.so">
      <div class="row">
        <button class="ghost" id="cancelAdd">Annuleren</button>
        <button class="primary" id="saveAdd">Toevoegen</button>
      </div>
    </div>
  </section>

  <section id="newsSection">
    <div class="section-head">
      <button class="text-btn" id="feedToggle">Bronnen</button>
    </div>

    <div class="feed-manager" id="feedManager">
      <div id="feedList"></div>
      <div class="add-form open" style="margin-top: 4px;">
        <input type="text" id="newFeedName" placeholder="Naam van de bron">
        <input type="text" id="newFeedUrl" placeholder="RSS link (https://...)">
        <button class="primary" id="saveFeed">Bron toevoegen</button>
      </div>
    </div>

    <div class="news-list" id="newsList">
      <p class="news-state">Nieuws laden...</p>
    </div>
  </section>
  </div>

</div>

<script>
/* ---------------- Config ---------------- */
const PROXY = "https://api.allorigins.win/raw?url=";
const DEFAULT_SHORTCUTS = [
  { name: "Gmail", url: "https://mail.google.com" },
  { name: "Notion", url: "https://notion.so" },
  { name: "Twitch", url: "https://twitch.tv" },
  { name: "Instagram", url: "https://instagram.com" }
];
const DEFAULT_FEEDS = [
  { name: "NOS", url: "https://feeds.nos.nl/nosnieuwsalgemeen", enabled: true, tag: "nos" },
  { name: "NU.nl", url: "https://www.nu.nl/rss/Algemeen", enabled: true, tag: "nu" },
  { name: "Tweakers", url: "https://feeds.feedburner.com/tweakers/mixed", enabled: true, tag: "tweakers" }
];
const UTRECHT = { lat: 52.09, lon: 5.12 };
const WEATHER_CODES = {
  0: "helder", 1: "overwegend helder", 2: "half bewolkt", 3: "bewolkt",
  45: "mist", 48: "mist", 51: "lichte motregen", 53: "motregen", 55: "zware motregen",
  61: "lichte regen", 63: "regen", 65: "zware regen", 71: "lichte sneeuw", 73: "sneeuw",
  75: "zware sneeuw", 80: "regenbuien", 81: "regenbuien", 82: "zware regenbuien",
  95: "onweer", 96: "onweer met hagel", 99: "zwaar onweer"
};

/* ---------------- Storage helpers ---------------- */
function load(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) {
    return fallback;
  }
}
function save(key, value) {
  localStorage.setItem(key, JSON.stringify(value));
}

let shortcuts = load("startpage_shortcuts", DEFAULT_SHORTCUTS);
let feeds = load("startpage_feeds", DEFAULT_FEEDS);

/* ---------------- Theme ---------------- */
function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
}
const savedTheme = localStorage.getItem("startpage_theme") ||
  (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
applyTheme(savedTheme);

document.getElementById("themeToggle").addEventListener("click", () => {
  const current = document.documentElement.getAttribute("data-theme");
  const next = current === "dark" ? "light" : "dark";
  applyTheme(next);
  localStorage.setItem("startpage_theme", next);
});

/* ---------------- Date + time + weather ---------------- */
function renderDate() {
  const date = new Date().toLocaleDateString("nl-NL", {
    weekday: "long", day: "numeric", month: "long"
  });
  document.getElementById("dateLine").textContent =
    date.charAt(0).toUpperCase() + date.slice(1);
}

function renderClock() {
  document.getElementById("clock").textContent = new Date().toLocaleTimeString("nl-NL", {
    hour: "2-digit", minute: "2-digit", hour12: false
  });
  renderDate();
}
renderClock();
setInterval(renderClock, 30 * 1000);

async function loadWeather() {
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${UTRECHT.lat}&longitude=${UTRECHT.lon}&current=temperature_2m,weather_code&timezone=Europe/Amsterdam`;
    const res = await fetch(url);
    const data = await res.json();
    const temp = Math.round(data.current.temperature_2m);
    const desc = WEATHER_CODES[data.current.weather_code] || "";
    document.getElementById("weatherLine").textContent = `Utrecht, ${temp}°C, ${desc}`;
  } catch (e) {
    document.getElementById("weatherLine").textContent = "Weer niet beschikbaar";
  }
}

loadWeather();
setInterval(loadWeather, 30 * 60 * 1000);

/* ---------------- Shortcuts ---------------- */
function faviconFor(url) {
  try {
    const host = new URL(url).hostname;
    return "https://www.google.com/s2/favicons?domain=" + host + "&sz=64";
  } catch (e) {
    return "";
  }
}

function normalizeUrl(url) {
  url = url.trim();
  if (!/^https?:\/\//i.test(url)) url = "https://" + url;
  return url;
}

function renderShortcuts() {
  const grid = document.getElementById("tileGrid");
  grid.innerHTML = "";

  shortcuts.forEach((s, i) => {
    const a = document.createElement("a");
    a.className = "tile";
    a.href = s.url;
    a.innerHTML = `
      <span class="remove-x" data-index="${i}">&times;</span>
      <img src="${faviconFor(s.url)}" alt="">
      <span>${s.name}</span>
    `;
    a.querySelector(".remove-x").addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation();
      shortcuts.splice(i, 1);
      save("startpage_shortcuts", shortcuts);
      renderShortcuts();
    });
    grid.appendChild(a);
  });

  const addTile = document.createElement("div");
  addTile.className = "tile add-tile";
  addTile.innerHTML = "<span>+</span>";
  addTile.addEventListener("click", () => {
    document.getElementById("addForm").classList.add("open");
  });
  grid.appendChild(addTile);
}
renderShortcuts();

document.getElementById("editToggle").addEventListener("click", () => {
  document.body.classList.toggle("editing");
  const editing = document.body.classList.contains("editing");
  document.getElementById("editToggle").textContent = editing ? "Klaar" : "Bewerken";
});

document.getElementById("cancelAdd").addEventListener("click", () => {
  document.getElementById("addForm").classList.remove("open");
  document.getElementById("newName").value = "";
  document.getElementById("newUrl").value = "";
});

document.getElementById("saveAdd").addEventListener("click", () => {
  const name = document.getElementById("newName").value.trim();
  const url = document.getElementById("newUrl").value.trim();
  if (!name || !url) return;
  shortcuts.push({ name, url: normalizeUrl(url) });
  save("startpage_shortcuts", shortcuts);
  document.getElementById("newName").value = "";
  document.getElementById("newUrl").value = "";
  document.getElementById("addForm").classList.remove("open");
  renderShortcuts();
});

/* ---------------- Feed manager ---------------- */
document.getElementById("feedToggle").addEventListener("click", () => {
  document.getElementById("feedManager").classList.toggle("open");
});

function renderFeedList() {
  const list = document.getElementById("feedList");
  list.innerHTML = "";
  feeds.forEach((f, i) => {
    const row = document.createElement("div");
    row.className = "feed-row";
    row.innerHTML = `
      <span class="feed-name">${f.name}</span>
      <button class="remove-feed" data-i="${i}">verwijderen</button>
      <label class="switch">
        <input type="checkbox" ${f.enabled ? "checked" : ""} data-i="${i}">
        <span class="slider"></span>
      </label>
    `;
    row.querySelector('input[type="checkbox"]').addEventListener("change", (e) => {
      feeds[i].enabled = e.target.checked;
      save("startpage_feeds", feeds);
      loadNews();
    });
    row.querySelector(".remove-feed").addEventListener("click", () => {
      feeds.splice(i, 1);
      save("startpage_feeds", feeds);
      renderFeedList();
      loadNews();
    });
    list.appendChild(row);
  });
}
renderFeedList();

document.getElementById("saveFeed").addEventListener("click", () => {
  const name = document.getElementById("newFeedName").value.trim();
  const url = document.getElementById("newFeedUrl").value.trim();
  if (!name || !url) return;
  feeds.push({ name, url: normalizeUrl(url), enabled: true, tag: "custom" });
  save("startpage_feeds", feeds);
  document.getElementById("newFeedName").value = "";
  document.getElementById("newFeedUrl").value = "";
  renderFeedList();
  loadNews();
});

/* ---------------- News ---------------- */
function parseFeedXml(xmlText) {
  const doc = new DOMParser().parseFromString(xmlText, "text/xml");
  const items = [...doc.querySelectorAll("item")];
  if (items.length) {
    return items.map(item => ({
      title: item.querySelector("title")?.textContent?.trim() || "",
      link: item.querySelector("link")?.textContent?.trim() || "",
      pubDate: item.querySelector("pubDate")?.textContent?.trim() || ""
    }));
  }
  // Atom fallback
  const entries = [...doc.querySelectorAll("entry")];
  return entries.map(entry => ({
    title: entry.querySelector("title")?.textContent?.trim() || "",
    link: entry.querySelector("link")?.getAttribute("href") || "",
    pubDate: entry.querySelector("updated")?.textContent?.trim() || ""
  }));
}

function timeAgo(dateStr) {
  const d = new Date(dateStr);
  if (isNaN(d)) return "";
  const mins = Math.round((Date.now() - d.getTime()) / 60000);
  if (mins < 1) return "nu";
  if (mins < 60) return mins + " min geleden";
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return hrs + " uur geleden";
  return Math.round(hrs / 24) + " dag geleden";
}

function withTimeout(promise, ms) {
  const timeout = new Promise((_, reject) =>
    setTimeout(() => reject(new Error("timeout")), ms)
  );
  return Promise.race([promise, timeout]);
}

async function fetchFeed(feed) {
  // Primary: rss2json, returns ready JSON, usually fastest
  try {
    const url = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feed.url)}`;
    const res = await withTimeout(fetch(url), 6000);
    const data = await res.json();
    if (data.status === "ok" && Array.isArray(data.items) && data.items.length) {
      return data.items.map(item => ({
        title: item.title, link: item.link, pubDate: item.pubDate,
        source: feed.name, tag: feed.tag
      }));
    }
    throw new Error("rss2json empty");
  } catch (e) {
    // Fallback: raw proxy + manual XML parse
    const res = await withTimeout(fetch(PROXY + encodeURIComponent(feed.url)), 7000);
    if (!res.ok) throw new Error("fetch failed");
    const text = await res.text();
    return parseFeedXml(text).map(item => ({ ...item, source: feed.name, tag: feed.tag }));
  }
}

async function loadNews() {
  const list = document.getElementById("newsList");
  const active = feeds.filter(f => f.enabled);

  if (!active.length) {
    list.innerHTML = '<p class="news-state">Geen actieve nieuwsbronnen. Zet er een aan bij Bronnen.</p>';
    return;
  }

  list.innerHTML = '<p class="news-state">Nieuws laden...</p>';

  const results = await Promise.allSettled(active.map(fetchFeed));

  const perSource = [];
  results.forEach(r => {
    if (r.status === "fulfilled" && r.value.length) {
      const sorted = [...r.value].sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));
      perSource.push(sorted);
    }
  });

  if (!perSource.length) {
    list.innerHTML = '<p class="news-state">Kon nieuws nu niet ophalen. Probeer het later opnieuw.</p>';
    return;
  }

  // Cap per source so one busy feed can't crowd out the others, then sort by time
  const capped = perSource.flatMap(group => group.slice(0, 8));
  const items = capped
    .sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate))
    .slice(0, 20);

  list.innerHTML = "";
  items.forEach(item => {
    const a = document.createElement("a");
    a.className = "news-item";
    a.href = item.link;
    a.target = "_blank";
    a.rel = "noopener";
    a.innerHTML = `
      <div class="headline">${item.title}</div>
      <div class="news-meta">
        <span class="source-tag ${item.tag}">${item.source}</span>
        <span>${timeAgo(item.pubDate)}</span>
      </div>
    `;
    list.appendChild(a);
  });
}
loadNews();
setInterval(loadNews, 15 * 60 * 1000);
</script>
</body>
</html>
